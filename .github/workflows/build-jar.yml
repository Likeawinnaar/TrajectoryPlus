name: Build Trajectory+ JARs

on:
  pull_request:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  targets:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.targets.outputs.matrix }}
    steps:
      - uses: actions/checkout@v4
      - id: targets
        run: python3 porting/ci.py matrix >> "$GITHUB_OUTPUT"

  build:
    name: Minecraft ${{ matrix.minecraft }}
    needs: targets
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.targets.outputs.matrix) }}
    env:
      MC_VERSION: ${{ matrix.minecraft }}
      JAR_NAME: ${{ matrix.jar }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: ${{ matrix.gradle }}
      - name: Compile and run checks
        run: gradle clean build -Pminecraft_version="$MC_VERSION" --stacktrace
      - name: Check runtime JAR
        run: python3 porting/ci.py verify "$MC_VERSION" "build/libs/$JAR_NAME"
      - name: Install virtual display if needed
        run: |
          if ! command -v xvfb-run >/dev/null; then
            sudo apt-get update
            sudo apt-get install -y xvfb
          fi
      - name: Install Mesa EGL for Minecraft 26.3
        if: matrix.minecraft == '26.3'
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl-mesa0 libgl1-mesa-dri
      - name: Start Minecraft with the runtime JAR
        run: python3 porting/smoke_client.py "$MC_VERSION"
      - name: Upload runtime JAR
        id: upload
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.jar }}
          path: build/libs/${{ matrix.jar }}
          if-no-files-found: error
          retention-days: 30
      - name: Record verified build
        env:
          ARTIFACT_URL: ${{ steps.upload.outputs.artifact-url }}
        run: |
          printf 'Minecraft %s passed compilation, physics tests, JAR metadata checks, and client startup.\n\n' "$MC_VERSION" >> "$GITHUB_STEP_SUMMARY"
          printf '[Download %s](%s)\n' "$JAR_NAME" "$ARTIFACT_URL" >> "$GITHUB_STEP_SUMMARY"
