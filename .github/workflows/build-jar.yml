name: Build Trajectory+ JAR

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout sources
        uses: actions/checkout@v4
      - name: Install Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Install Gradle 8.12
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.12"
      - name: Compile Minecraft 1.21.1 Fabric mod
        run: gradle build --stacktrace
      - name: Upload compiled Minecraft mod
        uses: actions/upload-artifact@v4
        with:
          name: TrajectoryPlus-1.0.0-jar
          path: |
            build/libs/trajectoryplus-1.0.0.jar
          if-no-files-found: error
          retention-days: 30
