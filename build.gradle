buildscript {
    repositories {
        maven {
            url = 'https://maven.fabricmc.net/'
            content { includeGroupByRegex 'net[.]fabricmc([.].*)?' }
        }
        mavenCentral()
    }
    dependencies {
        classpath "net.fabricmc:fabric-loom:${gradle.target.loom}"
    }
}

def target = gradle.target
def remapped = target.yarn != null
apply plugin: remapped ? 'fabric-loom' : 'net.fabricmc.fabric-loom'

version = gradle.targetModVersion
group = 'com.trajectoryplus'
base { archivesName = 'trajectoryplus' }

repositories {
    maven { url = 'https://maven.terraformersmc.com/releases/' }
    mavenCentral()
}

dependencies {
    minecraft "com.mojang:minecraft:${target.minecraft}"
    if (remapped) {
        mappings "net.fabricmc:yarn:${target.yarn}:v2"
    }
    def mod = remapped ? 'modImplementation' : 'implementation'
    add(mod, "net.fabricmc:fabric-loader:${target.loader}")
    add(mod, "net.fabricmc.fabric-api:fabric-api:${target.fabric_api}")
    add(mod, "com.terraformersmc:modmenu:${target.mod_menu}")
}

def numericVersion = target.minecraft.tokenize('.').last().toInteger()
sourceSets.main.java.srcDir(remapped ? 'src/yarn/java' : 'src/mojang/java')
if (remapped) {
    sourceSets.main.java.srcDir(numericVersion <= 8 ? 'src/yarnLegacy/java' :
        "src/yarn12${numericVersion}/java")
    if (numericVersion == 9) {
        sourceSets.main.resources.srcDir('src/yarn129/resources')
    }
} else {
    sourceSets.main.java.srcDir(target.minecraft.startsWith('26.1') ? 'src/mojang261/java' : 'src/mojangRenderThread/java')
}

processResources {
    def metadata = [version: project.version, minecraft: target.minecraft, java: target.java,
                    loader: target.minecraft == '1.21.1' ? '0.16.0' : target.loader,
                    modmenu: target.minecraft == '1.21.1' ? '11.0.0' : target.mod_menu,
                    mixins: target.minecraft == '1.21.9' ? '["trajectoryplus.client.mixins.json"]' : '[]']
    inputs.properties(metadata)
    filesMatching('fabric.mod.json') { expand metadata }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.release = target.java
}

java {
    sourceCompatibility = JavaVersion.toVersion(target.java)
    targetCompatibility = JavaVersion.toVersion(target.java)
    withSourcesJar()
}

jar {
    from('LICENSE') { rename { 'LICENSE_trajectoryplus' } }
}

tasks.register('physicsSelfTest', JavaExec) {
    dependsOn testClasses
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'com.trajectoryplus.PhysicsMathSelfTest'
}
tasks.named('test') { exclude '**/PhysicsMathSelfTest.class' }
tasks.named('check') { dependsOn 'physicsSelfTest' }
